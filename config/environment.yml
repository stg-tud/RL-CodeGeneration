name: code_gen
channels:
  - conda-forge
  - defaults
dependencies:
  - python=3.11
  - pip=24.0
  - ca-certificates
  - certifi
  - openssl
  - libffi
  - ncurses
  - readline
  - sqlite
  - tk
  - xz
  - zlib
  - mpi=1.0=mpich
  - mpich=4.1.1
  - mpi4py=4.0.3

  # Python Package Ecosystem
  - pip:
      # --- Unified Core Targeting ---
      - transformers==4.57.3
      - tokenizers==0.22.1

      # --- Core Deep Learning Foundations ---
      - torch==2.8.0
      - torchaudio==2.8.0
      - torchvision==0.23.0
      - triton==3.4.0
      - xformers==0.0.32.post1
      - sympy==1.14.0
      - numpy==1.26.4
      - packaging==25.0

      # --- Accelerators & Distributed Training ---
      - accelerate==1.12.0
      - deepspeed==0.18.3
      - ray==2.48.0
      - ninja==1.11.1.4
      - bitsandbytes==0.46.1

      # --- Hugging Face & Advanced Alignment (RLHF) ---
      - datasets==4.3.0
      - evaluate==0.4.6
      - peft==0.18.0
      - trl==0.24.0

      # --- High-Performance Serving & Inference ---
      - vllm==0.10.2
      - unsloth==2025.12.10
      - unsloth-zoo==2025.12.8
      - flashinfer-python==0.5.2
      - xgrammar==0.1.23
      - outlines>=0.2.5
      - llguidance==0.7.30

      # --- Constrained Generation & Guided Decoding ---
      # NOTE: syncode is REQUIRED (wrappers/syncode_wrapper.py + syncode_coef reward),
      # but it cannot be listed here: it hard-pins transformers==4.53.2, which conflicts
      # with the transformers 4.56-4.57 that vllm/unsloth need. Its pin is over-cautious
      # (verified working against 4.57), so install it AFTER this env is created with:
      #     pip install --no-deps syncode==0.4.16
      # --no-deps installs syncode only, without letting its stale transformers pin
      # downgrade the rest of the stack.
      - evalplus
      - codebleu==0.7.0
      - tree-sitter==0.22.0
      - tree-sitter-python==0.21.0
      - ruff    
      - joblib  

      # --- Infrastructure Elements ---
      - pandas==2.0.3
      - matplotlib==3.10.8
      - scipy==1.15.3
      - networkx==3.3
      - jinja2==3.1.6
      - pydantic==2.12.5
      - pydantic-core==2.41.5
      - wandb==0.24.1
      - tensorboard==2.19.0
      - click==8.2.1
      - tqdm==4.66.5
      - pyyaml==6.0.2
      - requests==2.32.5
      - httpx==0.28.1
      - fastapi==0.128.0
      - uvicorn==0.34.2
