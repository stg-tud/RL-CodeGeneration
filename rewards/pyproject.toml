# pyproject.toml
[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
# Select all rule sets you want to scan for.
# This list is comprehensive to catch as many issues as possible in one run.
select = [
    "E", "F", "W", "I", "UP", "B", "S", "ANN", "C", "N", "PL", "PT", "TID",
    # Add any other desired linters here as Ruff adds them or you discover them
]

# You might still have global ignores for rules you *never* care about,
# regardless of category.
ignore = [
    # Example: If you don't enforce docstrings
    "D100", "D101", "D102", "D103",
    "E501", # If a formatter handles line length or you don't care
]
